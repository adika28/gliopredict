name: Keep Hugging Face Backend Alive

on:
  schedule:
    # Menjadwalkan perintah untuk berjalan setiap 30 menit sekali (menggunakan format POSIX cron)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Memperbolehkan kamu untuk klik tombol "Run" manual jika ingin tes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a ping to Hugging Face Space
        run: |
          curl -s https://adika28-gliopredict-backend.hf.space/ > /dev/null
          echo "Ketukan sukses dikirim ke Hugging Face backend!"
